<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Actions menu</title><link rel="stylesheet" href="style.css"></head>
<body class="mockup">
<p class="frame-label">On the first of several columns</p><div class="frame app"><main style="height:8rem"><div class="row" style="max-width:14rem"><b>To do</b><span class="actions"><button class="icon bare" title="Actions" aria-expanded="true"><svg viewBox="0 0 16 16" width="16" height="16"><circle cx="3" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="13" cy="8" r="1.5"/></svg></button><div class="menu" role="menu"><button role="menuitem">Move right</button><button role="menuitem">Delete</button></div></span></div></main></div>
<p class="frame-label">On a card between two others</p><div class="frame app"><main style="height:10rem"><div class="row" style="max-width:14rem"><span>Write the tests</span><span class="actions"><button class="icon bare" title="Actions" aria-expanded="true"><svg viewBox="0 0 16 16" width="16" height="16"><circle cx="3" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="13" cy="8" r="1.5"/></svg></button><div class="menu" role="menu"><button role="menuitem">Move up</button><button role="menuitem">Move down</button><button role="menuitem">Move to column</button><button role="menuitem">Delete</button></div></span></div></main></div>
<p class="frame-label">On a board</p><div class="frame app"><main style="height:6rem"><div class="row" style="max-width:14rem"><span>Roadmap</span><span class="actions"><button class="icon bare" title="Actions" aria-expanded="true"><svg viewBox="0 0 16 16" width="16" height="16"><circle cx="3" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="13" cy="8" r="1.5"/></svg></button><div class="menu" role="menu"><button role="menuitem">Delete</button></div></span></div></main></div>
</body>
</html>
