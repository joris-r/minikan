<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login screen</title><link rel="stylesheet" href="style.css"></head>
<body class="mockup">
<p class="frame-label">Opened</p><div class="frame app"><main><h1>Log in</h1><form class="login"><label>Name <input value=""></label><label>Password <input type="password" value=""></label><button>Log in</button></form></main></div>
<p class="frame-label">Refused with 401</p><div class="frame app"><main><h1>Log in</h1><form class="login"><label>Name <input value="demo"></label><label>Password <input type="password" value=""></label><button>Log in</button><p role="alert">Invalid name or password.</p></form></main></div>
<p class="frame-label">Failed otherwise</p><div class="frame app"><main><h1>Log in</h1><form class="login"><label>Name <input value="demo"></label><label>Password <input type="password" value="demo-password"></label><button>Log in</button><p role="alert">The login could not be sent; try again.</p></form></main></div>
