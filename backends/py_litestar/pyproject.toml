[project]
name = "minikan-litestar"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "litestar[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "minikan"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
