[package]
name = "minikan"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
uuid = { version = "1.29.0", features = ["v7"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
